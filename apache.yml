---
- name: Install and Start Apache Web Server
  hosts: webservers
  become: yes

  tasks:
    - name: Update system Packages
      apt:
        update_cache: yes

    - name: Install Apache
      apt:
        name: apache2
        state: present

    - name: Start and Enable Apache
      service:
        name: apache2
        state: started
        enabled: yes
